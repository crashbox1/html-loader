<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Canvas Page Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 15px;
      margin: 0;
      background-color: #f9f9f9;
    }
    textarea {
      width: 100%;
      height: 200px;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
      resize: vertical;
    }
    button {
      margin-top: 10px;
      padding: 12px 20px;
      background-color: #00c4cc; /* Canva-like Teal */
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      width: 100%;
      transition: background 0.2s ease;
    }
    button:hover {
      background-color: #00a9b0;
    }
  </style>
</head>
<body>

  <h3>Paste HTML Code</h3>
  <textarea id="htmlInput" placeholder="<h1>Hello World</h1><p>Type your HTML here...</p>"></textarea>
  <button onclick="generatePageInNewTab()">Generate Page in New Tab</button>

  <script>
    function generatePageInNewTab() {
      const htmlContent = document.getElementById('htmlInput').value;
      
      if (!htmlContent.trim()) {
        alert('Please enter some HTML code first!');
        return;
      }

      // Convert the user's raw HTML string into a secure Blob object
      const blob = new Blob([htmlContent], { type: 'text/html' });
      
      // Create a temporary unique local URL for that object blob
      const pageUrl = URL.createObjectURL(blob);
      
      // Open the compiled local URL structure in a new browser tab window
      window.open(pageUrl, '_blank');
    }
  </script>

</body>
</html>
