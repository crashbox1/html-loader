<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Canvas Page Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 15px;
      margin: 0;
      background-color: #f9f9f9;
    }
    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
      resize: vertical;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #00c4cc; /* Canva-like Teal */
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    button:hover {
      background-color: #00a9b0;
    }
    #output-container {
      margin-top: 15px;
      display: none;
    }
    iframe {
      width: 100%;
      height: 400px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
    }
  </style>
</head>
<body>

  <h3>Paste HTML Code</h3>
  <textarea id="htmlInput" placeholder="<h1>Hello World</h1><p>Type your HTML here...</p>"></textarea>
  <button onclick="generatePage()">Generate Page</button>

  <div id="output-container">
    <h3>Generated View:</h3>
    <iframe id="outputFrame"></iframe>
  </div>

  <script>
    function generatePage() {
      const htmlContent = document.getElementById('htmlInput').value;
      const container = document.getElementById('output-container');
      const iframe = document.getElementById('outputFrame');
      
      if (!htmlContent.trim()) {
        alert('Please enter some HTML code first!');
        return;
      }

      // Show container and render the code inside the iframe securely
      container.style.display = 'block';
      const doc = iframe.contentWindow.document;
      doc.open();
      doc.write(htmlContent);
      doc.close();
    }
  </script>

</body>
</html>
